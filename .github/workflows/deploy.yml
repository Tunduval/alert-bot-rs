name: Build and deploy to production

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v3-ubuntu-22.04"
          cache-on-failure: true
      - name: Run checks
        env:
          DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
        run: ./check

  build:
    name: Build release artifact
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v3-ubuntu-22.04"
      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --release --locked --bin alert-bot
          strip target/release/alert-bot
          test -f target/release/alert-bot
          test ! -L target/release/alert-bot
          test "$(stat -c '%s' target/release/alert-bot)" -le 67108864
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alert-bot-${{ github.sha }}
          path: target/release/alert-bot
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to LXC
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: alert-bot-${{ github.sha }}
          path: release
      - name: Verify release artifact
        run: |
          set -euo pipefail
          test -f release/alert-bot
          test ! -L release/alert-bot
          test "$(stat -c '%s' release/alert-bot)" -le 67108864
          chmod 0755 release/alert-bot

      - name: Install pinned cloudflared
        env:
          CLOUDFLARED_SHA256: d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db
          CLOUDFLARED_VERSION: 2026.10.0
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            --output "$RUNNER_TEMP/cloudflared"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/cloudflared" "$RUNNER_TEMP/bin-cloudflared"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LXC_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LXC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Install and restart on the LXC
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" == "root" ]]

          cat > "$RUNNER_TEMP/cloudflared-proxy" <<'PROXY'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$RUNNER_TEMP/bin-cloudflared" access ssh \
            --hostname "$SSH_HOST" \
            --service-token-id "$CF_ID" \
            --service-token-secret "$CF_SECRET"
          PROXY
          chmod 0700 "$RUNNER_TEMP/cloudflared-proxy"
          ssh_options=(
            -o "ProxyCommand=$RUNNER_TEMP/cloudflared-proxy"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o BatchMode=yes
            -o ConnectTimeout=20
          )

          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" < release/alert-bot
