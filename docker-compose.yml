# Local development database only. The bot itself runs natively with
# `cargo run -p alert-bot`, with DATABASE_URL pointing at this container.
#
# Production does NOT use this file — the LXC runs both Postgres and
# the bot as native services. See README.md → "Production deployment".
services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alertbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-alertbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost so `cargo run` on the dev host can connect.
      # Not exposed on the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
